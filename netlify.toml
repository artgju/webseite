[build]
  publish = "."

# Wartungsmodus DEAKTIVIERT (09.01.2026)
# Um wieder zu aktivieren, Kommentare entfernen:
# [[redirects]]
#   from = "/"
#   to = "/maintenance.html"
#   status = 302
#   force = true

# Force HTTPS
[[redirects]]
  from = "http://vuralavci.de/*"
  to = "https://vuralavci.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.vuralavci.de/*"
  to = "https://vuralavci.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.vuralavci.de/*"
  to = "https://vuralavci.de/:splat"
  status = 301
  force = true

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # HTTPS erzwingen
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Schutz vor Clickjacking
    X-Frame-Options = "DENY"
    # Schutz vor MIME-Type Sniffing
    X-Content-Type-Options = "nosniff"
    # Referrer Policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Berechtigungen einschränken
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Content Security Policy
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self' https:; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"

# Unhashed CSS and JavaScript must be revalidated after each deployment.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Customer logo filenames are stable assets and may be cached permanently.
[[headers]]
  for = "/images/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/maintenance.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/maintenance/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/quality-check.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/quality-check/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
